<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISO 20387 Accreditation Roadmap</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 md:p-12 font-sans antialiased flex flex-col justify-between">

  <div class="w-full max-w-6xl mx-auto my-auto">
    
    <header class="flex flex-col md:flex-row justify-between items-center gap-6 mb-12 pb-6 border-b border-slate-900">
      <div class="text-center md:text-left">
        <h1 class="text-4xl md:text-5xl font-black tracking-tight uppercase text-white mb-2">
          ISO 20387 Accreditation Roadmap
        </h1>
        <p class="text-xl text-teal-400 font-bold tracking-wide">
          Target: 6th UK Accredited Biobank
        </p>
      </div>
      
      <div class="bg-white/5 p-4 rounded-2xl border border-slate-800/80 backdrop-blur-sm flex items-center justify-center max-w-[240px]">
        <img src="0d476a53-c9ca-41cc-80ac-5b6e8885f41c.png" alt="King's Genomics Logo" class="h-12 w-auto object-contain">
      </div>
    </header>

    <main class="relative px-4 my-16">
      
      <div class="absolute top-[26px] left-16 right-16 h-3 bg-slate-900 rounded-full border border-slate-800/80 z-0 hidden md:block"></div>
      <div class="absolute top-[31px] left-16 right-16 h-0.5 border-t-2 border-dashed border-slate-700 z-0 hidden md:block"></div>

      <div id="roadmap-track" class="grid grid-cols-1 md:grid-cols-3 gap-8 relative z-10">
        <div id="loading" class="text-slate-500 font-medium text-center py-12 col-span-full">
          Connecting to roadmap data...
        </div>
      </div>
    </main>

    <section class="mt-12 grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-900/30 border border-slate-900 p-6 rounded-3xl max-w-4xl mx-auto">
      <div>
        <h3 class="text-xs font-black uppercase tracking-widest text-amber-500 mb-3 flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span> Assessor Capacity Risk Log
        </h3>
        <p class="text-slate-400 text-xs leading-relaxed" id="risk-notes">
          Loading constraints...
        </p>
      </div>
      <div class="border-t md:border-t-0 md:border-l border-slate-900 pt-4 md:pt-0 md:pl-6">
        <h3 class="text-xs font-black uppercase tracking-widest text-cyan-400 mb-3 flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span> UK Biobank Landscape Context
        </h3>
        <p class="text-slate-400 text-xs leading-relaxed" id="landscape-notes">
          Loading metrics...
        </p>
      </div>
    </section>

  </div>

  <script>
    const track = document.getElementById('roadmap-track');
    const riskNotes = document.getElementById('risk-notes');
    const landscapeNotes = document.getElementById('landscape-notes');

    fetch('data.json')
      .then(res => {
        if (!res.ok) throw new Error("File not found");
        return res.json();
      })
      .then(steps => {
        track.innerHTML = ''; // Wipe loading message

        // 1. ISOLATE CORE ROAD ITEMS vs BACKGROUND NOTES
        const coreRoadItems = steps.filter(item => item.id === 1 || item.id === 4 || item.id === 6);
        const capacityItem = steps.find(item => item.id === 3);
        const landscapeItem = steps.find(item => item.id === 5);

        // 2. INJECT BACKGROUND CONTEXT INTO PANEL
        if (capacityItem) riskNotes.textContent = `${capacityItem.description} ${capacityItem.notes || ''}`;
        if (landscapeItem) landscapeNotes.textContent = `${landscapeItem.description} ${landscapeItem.notes || ''}`;

        // 3. RENDER THE SIMPLIFIED ROAD HOPS
        coreRoadItems.forEach((step) => {
          let pinTheme, borderTheme;
          
          if (step.status === 'Submitted') {
            pinTheme = 'bg-emerald-500 ring-emerald-950 ring-4 shadow-[0_0_15px_rgba(16,185,129,0.6)]';
            borderTheme = 'border-emerald-900/40 bg-emerald-950/5 text-emerald-400';
          } else if (step.status === 'Audit Prep') {
            pinTheme = 'bg-amber-500 ring-amber-950 ring-4 shadow-[0_0_15px_rgba(245,158,11,0.6)]';
            borderTheme = 'border-amber-900/30 bg-amber-950/5 text-amber-400';
          } else {
            pinTheme = 'bg-slate-700 ring-slate-950 ring-4';
            borderTheme = 'border-slate-800 bg-slate-900/20 text-slate-400';
          }

          const node = document.createElement('div');
          node.className = "flex flex-col items-center text-center";

          node.innerHTML = `
            <div class="w-14 h-14 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center mb-6 z-20 relative">
              <div class="w-4 h-4 rounded-full ${pinTheme}"></div>
            </div>

            <div class="bg-slate-900/40 p-5 rounded-2xl border ${borderTheme} shadow-xl backdrop-blur-sm w-full min-h-[140px] flex flex-col justify-center">
              <span class="text-[10px] font-black uppercase tracking-widest bg-slate-950/80 px-2.5 py-1 rounded-md border border-slate-800/60 block mb-2 w-fit mx-auto">
                ${step.timeline}
              </span>
              <h3 class="text-lg font-bold text-white leading-tight">${step.title}</h3>
              <p class="text-slate-300 text-xs mt-1.5 leading-relaxed">${step.description}</p>
            </div>
          `;
          
          track.appendChild(node);
        });
      })
      .catch(err => {
        console.error(err);
        track.innerHTML = `<div class="text-red-400 text-sm col-span-full text-center">Failed to parse data.json profile assets.</div>`;
      });
  </script>
</body>
</html>
