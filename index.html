<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISO 20387 Accreditation Roadmap</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 md:p-12 font-sans antialiased">

  <div class="max-w-5xl mx-auto">
    
    <header class="text-center mb-16 relative">
      <h1 class="text-4xl md:text-5xl font-black tracking-tight uppercase text-white mb-2">
        ISO 20387 Accreditation Roadmap
      </h1>
      <p class="text-xl text-teal-400 font-bold tracking-wide">
        Target: 6th UK Accredited Biobank
      </p>
      <div class="w-24 h-1 bg-gradient-to-r from-teal-500 to-emerald-500 mx-auto mt-4 rounded-full"></div>
    </header>

    <div class="relative w-full">
      
      <div class="absolute left-1/2 transform -translate-x-1/2 w-4 bg-slate-800 h-full rounded-full hidden md:block opacity-60"></div>
      <div class="absolute left-1/2 transform -translate-x-1/2 w-1 bg-gradient-to-b from-emerald-500 via-teal-500 via-amber-500 to-slate-700 h-full hidden md:block"></div>

      <div class="absolute left-6 w-1 bg-gradient-to-b from-emerald-500 via-teal-500 via-amber-500 to-slate-700 h-full md:hidden"></div>

      <div id="roadmap-track" class="space-y-12 relative">
        </div>
    </div>

    <footer class="mt-20 border-t border-slate-800 pt-8 flex flex-wrap justify-center gap-6 text-sm font-semibold tracking-wider uppercase">
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-emerald-500"></span> Green = Submitted</div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-cyan-400"></span> Blue = Active/Planned</div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-amber-500"></span> Amber = Audit Prep</div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-slate-500"></span> Slate = Not Started</div>
    </footer>

  </div>

  <script>
    const track = document.getElementById('roadmap-track');

    // Fetch local data structure safely bypassing CORS issue on live server
    fetch('data.json')
      .then(res => {
        if (!res.ok) throw new Error("Data stream unreadable");
        return res.json();
      })
      .then(steps => {
        track.innerHTML = ''; // Wipe static layout

        steps.forEach((step, index) => {
          // Check layout alignment orientation (Alternate left/right sides on desktop)
          const isLeft = index % 2 === 0;

          // Compute custom color theme mappings based on text statuses
          let statusColor, pinColor, GlowEffect;
          switch(step.status) {
            case 'Submitted':
              statusColor = 'text-emerald-400';
              pinColor = 'bg-emerald-500 border-emerald-300';
              GlowEffect = 'shadow-[0_0_15px_rgba(16,185,129,0.3)]';
              break;
            case 'Active/Planned':
              statusColor = 'text-cyan-400';
              pinColor = 'bg-cyan-400 border-cyan-200';
              GlowEffect = 'shadow-[0_0_15px_rgba(34,211,238,0.3)]';
              break;
            case 'Audit Prep':
              statusColor = 'text-amber-400';
              pinColor = 'bg-amber-500 border-amber-300';
              GlowEffect = 'shadow-[0_0_15px_rgba(245,158,11,0.3)]';
              break;
            default:
              statusColor = 'text-slate-400';
              pinColor = 'bg-slate-600 border-slate-400';
              GlowEffect = '';
          }

          // Build item element block
          const row = document.createElement('div');
          row.className = `flex flex-col md:flex-row items-start relative w-full ${isLeft ? 'md:flex-row-reverse' : ''}`;

          row.innerHTML = `
            <div class="w-full md:w-1/2 hidden md:block"></div>

            <div class="absolute left-6 md:left-1/2 transform -translate-x-1/2 w-6 h-6 rounded-full ${pinColor} border-4 ${GlowEffect} z-10 flex items-center justify-center">
              <div class="w-1.5 h-1.5 bg-slate-900 rounded-full"></div>
            </div>

            <div class="w-full md:w-1/2 pl-16 md:pl-0 ${isLeft ? 'md:pr-16 text-left md:text-right' : 'md:pl-16 text-left'}">
              <div class="bg-slate-800/80 backdrop-blur-sm p-6 rounded-2xl border border-slate-700/60 shadow-lg hover:border-slate-600/80 transition-all duration-300">
                <span class="text-xs font-bold uppercase tracking-widest ${statusColor} block mb-1">
                  ${step.timeline}
                </span>
                <h3 class="text-xl font-bold text-white mb-2">${step.title}</h3>
                <p class="text-slate-300 text-sm leading-relaxed mb-3">${step.description}</p>
                
                ${step.notes ? `
                  <div class="mt-3 pt-3 border-t border-slate-700/50 text-xs text-slate-400 italic">
                    Note: ${step.notes}
                  </div>
                ` : ''}
              </div>
            </div>
          `;
          track.appendChild(row);
        });
      })
      .catch(err => {
        console.error(err);
        track.innerHTML = `<div class='text-red-400 text-center py-8 font-medium w-full'>Failed to stream data.json. Verify configuration path or host platform server dependencies.</div>`;
      });
  </script>
</body>
</html>
