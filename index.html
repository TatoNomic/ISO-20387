<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISO 20387 Accreditation Roadmap</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 md:p-12 font-sans antialiased flex flex-col justify-between">

  <div class="w-full max-w-7xl mx-auto my-auto">
    
    <header class="text-center mb-16">
      <h1 class="text-4xl md:text-5xl font-black tracking-tight uppercase text-white mb-2">
        ISO 20387 Accreditation Roadmap
      </h1>
      <p class="text-xl text-teal-400 font-bold tracking-wide">
        Target: 6th UK Accredited Biobank
      </p>
      <div class="w-24 h-1 bg-gradient-to-r from-teal-500 to-emerald-500 mx-auto mt-4 rounded-full"></div>
    </header>

    <main class="relative px-4 my-12">
      
      <div class="absolute top-[26px] left-8 right-8 h-3 bg-slate-900 rounded-full border border-slate-800/80 z-0 hidden md:block"></div>
      <div class="absolute top-[31px] left-8 right-8 h-0.5 border-t-2 border-dashed border-slate-700 z-0 hidden md:block"></div>

      <div id="roadmap-track" class="grid grid-cols-1 md:grid-cols-6 gap-6 relative z-10">
        <div id="loading" class="text-slate-500 font-medium text-center py-12 col-span-full">
          Connecting to roadmap data...
        </div>
      </div>
    </main>

    <footer class="mt-12 border-t border-slate-900 pt-8 flex flex-wrap justify-center gap-6 text-xs font-semibold tracking-wider uppercase bg-slate-900/40 p-4 rounded-xl max-w-2xl mx-auto">
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.5)]"></span> Green = Submitted</div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.5)]"></span> Blue = Active/Planned</div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-amber-500 shadow-[0_0_10px_rgba(245,158,11,0.5)]"></span> Amber = Audit Prep</div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-slate-600"></span> Slate = Not Started</div>
    </footer>

  </div>

  <script>
    const track = document.getElementById('roadmap-track');

    fetch('data.json')
      .then(res => {
        if (!res.ok) throw new Error("File not found");
        return res.json();
      })
      .then(steps => {
        track.innerHTML = ''; // Clear loading state

        steps.forEach((step, index) => {
          let statusTheme, pinTheme;
          
          switch(step.status) {
            case 'Submitted':
              statusTheme = 'bg-emerald-950/10 text-emerald-400 border-emerald-900/40';
              pinTheme = 'bg-emerald-500 ring-emerald-950 ring-4 shadow-[0_0_15px_rgba(16,185,129,0.6)]';
              break;
            case 'Active/Planned':
              statusTheme = 'bg-cyan-950/10 text-cyan-400 border-cyan-900/40';
              pinTheme = 'bg-cyan-400 ring-cyan-950 ring-4 shadow-[0_0_15px_rgba(34,211,238,0.6)]';
              break;
            case 'Audit Prep':
              statusTheme = 'bg-amber-950/10 text-amber-400 border-amber-900/30';
              pinTheme = 'bg-amber-500 ring-amber-950 ring-4 shadow-[0_0_15px_rgba(245,158,11,0.6)]';
              break;
            default:
              statusTheme = 'bg-slate-900/30 text-slate-400 border-slate-800';
              pinTheme = 'bg-slate-700 ring-slate-950 ring-4';
          }

          const node = document.createElement('div');
          node.className = "flex flex-col items-center text-center group";

          node.innerHTML = `
            <div class="w-14 h-14 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center mb-6 z-20 relative transition-transform duration-300 group-hover:scale-110">
              <div class="w-4 h-4 rounded-full ${pinTheme}"></div>
            </div>

            <div class="bg-slate-900/40 p-5 rounded-2xl border ${statusTheme} shadow-xl backdrop-blur-sm w-full flex flex-col justify-between flex-grow min-h-[220px]">
              <div>
                <span class="text-[10px] font-black uppercase tracking-widest bg-slate-950/80 px-2.5 py-1 rounded-md border border-slate-800/60 block mb-3 w-fit mx-auto">
                  ${step.timeline}
                </span>
                <h3 class="text-base font-bold text-white mb-2 leading-snug">${step.title}</h3>
                <p class="text-slate-300 text-xs leading-relaxed">${step.description}</p>
              </div>
              
              ${step.notes ? `
                <div class="mt-4 pt-3 border-t border-slate-950 text-[10px] text-slate-400 italic leading-normal">
                  ${step.notes}
                </div>
              ` : ''}
            </div>
          `;
          
          track.appendChild(node);
        });
      })
      .catch(err => {
        console.error(err);
        document.getElementById('loading').innerHTML = `
          <div class="text-red-400 font-medium p-4 bg-red-950/20 border border-red-900/40 rounded-xl max-w-sm mx-auto text-sm">
            Failed to load data.json. Ensure file name is correct.
          </div>
        `;
      });
  </script>
</body>
</html>
