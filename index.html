<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISO 20387 Accreditation Roadmap</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 md:p-12 font-sans antialiased flex flex-col justify-between">

  <div class="w-full max-w-6xl mx-auto">
    
    <header class="text-center mb-12">
      <h1 class="text-4xl md:text-5xl font-black tracking-tight uppercase text-white mb-2">
        ISO 20387 Accreditation Roadmap
      </h1>
      <p class="text-xl text-teal-400 font-bold tracking-wide">
        Target: 6th UK Accredited Biobank
      </p>
      <div class="w-24 h-1 bg-gradient-to-r from-teal-500 to-emerald-500 mx-auto mt-4 rounded-full"></div>
    </header>

    <main>
      <div id="roadmap-track" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 relative">
        <div id="loading" class="text-slate-500 font-medium text-center py-12 col-span-full">
          Connecting to data.json path...
        </div>
      </div>
    </main>

    <footer class="mt-16 border-t border-slate-900 pt-8 flex flex-wrap justify-center gap-6 text-xs font-semibold tracking-wider uppercase bg-slate-900/40 p-4 rounded-xl max-w-2xl mx-auto">
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.5)]"></span> Green = Submitted</div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.5)]"></span> Blue = Active/Planned</div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-amber-500 shadow-[0_0_10px_rgba(245,158,11,0.5)]"></span> Amber = Audit Prep</div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-slate-600"></span> Slate = Not Started</div>
    </footer>

  </div>

  <script>
    const track = document.getElementById('roadmap-track');

    fetch('data.json')
      .then(res => {
        if (!res.ok) throw new Error("File not found");
        return res.json();
      })
      .then(steps => {
        track.innerHTML = ''; // Clear loading state

        steps.forEach((step, index) => {
          let statusTheme, pinColor;
          
          switch(step.status) {
            case 'Submitted':
              statusTheme = 'bg-emerald-950/20 text-emerald-400 border-emerald-800/40';
              pinColor = 'bg-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.6)]';
              break;
            case 'Active/Planned':
              statusTheme = 'bg-cyan-950/20 text-cyan-400 border-cyan-800/40';
              pinColor = 'bg-cyan-400 shadow-[0_0_15px_rgba(34,211,238,0.6)]';
              break;
            case 'Audit Prep':
              statusTheme = 'bg-amber-950/15 text-amber-400 border-amber-900/30';
              pinColor = 'bg-amber-500 shadow-[0_0_15px_rgba(245,158,11,0.6)]';
              break;
            default:
              statusTheme = 'bg-slate-900/40 text-slate-400 border-slate-800';
              pinColor = 'bg-slate-600';
          }

          const card = document.createElement('div');
          // Cards flex horizontally inside themselves to keep the track layout clean
          card.className = `bg-slate-900/50 p-6 rounded-3xl border ${statusTheme} shadow-lg backdrop-blur-sm transition-all duration-300 hover:scale-[1.01] flex flex-col justify-between min-h-[200px]`;

          card.innerHTML = `
            <div>
              <div class="flex justify-between items-center mb-4">
                <span class="text-[10px] font-black uppercase tracking-widest bg-slate-950/60 px-3 py-1 rounded-full border border-slate-800">
                  ${step.timeline}
                </span>
                <div class="w-2.5 h-2.5 rounded-full ${pinColor}"></div>
              </div>
              
              <h3 class="text-lg font-bold text-white mb-1.5 leading-tight">${step.title}</h3>
              <p class="text-slate-300 text-xs leading-relaxed">${step.description}</p>
            </div>
            
            ${step.notes ? `
              <div class="mt-4 pt-3 border-t border-slate-950 text-[11px] text-slate-400 italic">
                ${step.notes}
              </div>
            ` : ''}
          `;
          
          track.appendChild(card);
        });
      })
      .catch(err => {
        console.error(err);
        document.getElementById('loading').innerHTML = `
          <div class="text-red-400 font-medium p-4 bg-red-950/20 border border-red-900/40 rounded-xl max-w-sm mx-auto text-sm">
            Failed to load data.json. Ensure file name is correct.
          </div>
        `;
      });
  </script>
</body>
</html>
